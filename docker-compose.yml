services:
  grokputer:
    build: .
    image: grokputer:latest
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - GROK_MODEL=${GROK_MODEL:-grok-4-fast-reasoning}
      - XAI_BASE_URL=${XAI_BASE_URL:-https://api.x.ai/v1}
      - REQUIRE_CONFIRMATION=${REQUIRE_CONFIRMATION:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PROCESS_ID=${PROCESS_ID:-main}
    volumes:
      - ./vault:/app/vault
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: sh -c "while true; do python main.py --task 'invoke server prayer' && sleep 300; done"
    restart: unless-stopped
    depends_on:
      - redis
    profiles:
      - pantheon

  # Optional: VNC server for debugging
  grokputer-vnc:
    build: .
    image: grokputer:latest
    container_name: grokputer-vnc
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - GROK_MODEL=${GROK_MODEL:-grok-4-fast-reasoning}
      - DISPLAY=:99
    volumes:
      - ./vault:/app/vault
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    ports:
      - "5900:5900"
    command: >
      sh -c "Xvfb :99 -screen 0 1920x1080x24 &
             x11vnc -display :99 -forever -shared -localhost no &
             python main.py --task '${TASK:-invoke server prayer}'"
    profiles:
      - debug

  redis:
    image: redis:7-alpine
    container_name: grokputer-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    profiles:
      - pantheon

  selenium-browser:
    build: ./selenium
    container_name: selenium-browser
    command: python test_selenium.py

volumes:
  redis_data: